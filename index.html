<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Marina Bay Sands — Cinematic Architectural Reconstruction</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e6edf3;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      transition: opacity 0.4s ease;
    }

    .interactive {
      pointer-events: auto;
    }

    /* Cinematic letterbox aspect markers */
    .film-letterbox-top, .film-letterbox-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: 0; /* default full height view */
      background: #000;
      z-index: 5;
      pointer-events: none;
    }

    /* Minimalist Loading Screen */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #06090e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-title {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      letter-spacing: 0.3em;
      color: #f0f6fc;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .loader-subtitle {
      font-size: 0.85rem;
      color: #8b949e;
      letter-spacing: 0.15em;
      margin-bottom: 24px;
    }

    .loader-bar-bg {
      width: 240px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .loader-bar-fill {
      width: 0%;
      height: 100%;
      background: #e6b85c;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div id="loader">
    <div class="loader-title">Marina Bay Sands</div>
    <div class="loader-subtitle">Procedural Architectural Reconstruction</div>
    <div class="loader-bar-bg">
      <div id="loader-progress" class="loader-bar-fill"></div>
    </div>
  </div>

  <div id="ui-overlay"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
